<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piece title</title>
<!-- The dealt look goes here: the font link and the <style> holding :root that `node scripts/deal.mjs --pick 1` prints. -->
<style>
/* The base page every recipe assumes (references/motion.md). Colours, corners, shadows and faces come only from the sheet. */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } /* a phone must not enlarge text on its own */
body { margin: 0; min-height: 100dvh; background: var(--ground); color: var(--ink); font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
button, input { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* The dealt direction's page rules go first (references/directions.md): they lay out the body and size #piece, since a
   percentage width inside #piece has nothing to resolve against. The piece's own styles follow. */
</style>
<script type="module">
/* In the head, so it runs before every module script in the body. Paste skills/settle/assets/kernel.js here, then name the dealt register once: */
settle.register("crisp");
</script>
</head>
<body>
<main id="piece">
  <!-- The piece's markup. -->
</main>
<script type="module">
// The piece's code. R holds the dealt register's presets, or the calm set when the system asks for
// reduced motion. Read time only from settle.now(). Handlers set targets; one loop draws every moving style.
const R = settle.register();

function draw() {
  const t = settle.now();
  // Set each moving style from t here.
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
